name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (leave empty to use current ref)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              TAG="$GITHUB_REF_NAME"
            else
              echo "::error::tag_name is required when the workflow is not triggered from a tag ref."
              exit 1
            fi
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::Invalid release tag: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag is merged into main
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git fetch origin main
          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag ${RELEASE_TAG} is not merged into the 'main' branch. Releases can only be published from main."
            exit 1
          fi

      - name: Generate Changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release notes exist
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${RELEASE_TAG}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
